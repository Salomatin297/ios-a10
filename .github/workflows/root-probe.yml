name: root-probe

on:
  workflow_dispatch:

env:
  IPSW: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"

jobs:
  owners:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Host tools and disk
        run: |
          set -eux
          sw_vers
          df -h /
          hdiutil attach -help 2>&1 | grep -A2 -i owners || true

      - name: APFS owners
        run: |
          set -euo pipefail
          mkdir -p work
          # AppOS is the small component (10 MiB), enough to test APFS ownership.
          python3 tools/remotezip.py "$IPSW" 087-86715-047.dmg work
          mkdir -p work/appos
          hdiutil attach -owners on -nobrowse -readonly -mountpoint work/appos work/087-86715-047.dmg
          mount | grep -i appos || true
          echo "--- ls -ln ---"
          ls -ln work/appos | head -20
          echo "--- stat ---"
          find work/appos -maxdepth 2 -print | head -10
          find work/appos -maxdepth 2 -exec stat -f '%u:%g %Sp %N' {} \; | head -10
          hdiutil detach work/appos

      - name: HFS+ owners
        run: |
          set -euo pipefail
          mkfile -n 1g work/test.img
          dev=$(hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage -nomount work/test.img | awk 'NR==1{print $1}')
          echo "dev=$dev"
          sudo "$(command -v newfs_hfs)" -s -J -v iOSTest "$dev"
          hdiutil detach "$dev"
          mkdir -p work/hfsmnt
          hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage -mountpoint work/hfsmnt work/test.img
          echo "--- mount line ---"
          mount | grep -i hfs || true
          sudo sh -c 'echo hello > work/hfsmnt/hello.txt'
          sudo chown 0:0 work/hfsmnt/hello.txt
          sudo chmod 0644 work/hfsmnt/hello.txt
          sudo mkdir -p work/hfsmnt/private/var/keybags
          sudo chown 0:0 work/hfsmnt/private/var/keybags
          sudo chmod 0700 work/hfsmnt/private/var/keybags
          echo "--- owners on ---"
          ls -ln work/hfsmnt
          ls -ln work/hfsmnt/private/var
          hdiutil detach work/hfsmnt
          hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage -mountpoint work/hfsmnt work/test.img
          echo "--- after remount ---"
          ls -ln work/hfsmnt
          ls -ln work/hfsmnt/private/var
          hdiutil detach work/hfsmnt
          dev=$(hdiutil attach -owners on -imagekey diskimage-class=CRawDiskImage -nomount work/test.img | awk 'NR==1{print $1}')
          sudo "$(command -v fsck_hfs)" -f -n "$dev" || true
          hdiutil detach "$dev"
